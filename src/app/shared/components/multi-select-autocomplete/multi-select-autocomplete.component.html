<div class="multi-select-autocomplete-field d-flex flex-column">
  <span class="mb-1">{{ label }}</span>

  <nb-select-with-autocomplete
    multiple
    withOptionsAutocomplete
    [fullWidth]="true"
    size="tiny"
    [placeholder]="inputPlaceholder"
    [disabled]="loading || disabled"
    [selected]="selectedValues"
    (selectedChange)="onSelectionChange($event)"
    (optionsAutocompleteInputChange)="onSearch($event)"
  >
    <nb-select-label>{{ inputPlaceholder }}</nb-select-label>

    <nb-option
      *ngFor="let item of filteredItems; trackBy: trackByValue"
      [value]="valueOf(item)"
      [hidden]="isSelected(item) && !isSearchMatch(item)"
    >
      {{ displayOf(item) }}
    </nb-option>
  </nb-select-with-autocomplete>

  <div
    *ngIf="loading"
    class="autocomplete-loading text-info-custom small mt-1 d-flex align-items-center gap-1"
    role="status"
  >
    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
    {{ loadingText }}
  </div>

  <div class="selected-items-row" *ngIf="selectedItems.length > 0">
    <div
      *ngFor="let item of selectedItems"
      class="filter-chip"
      [nbTooltip]="displayOf(item)"
    >
      <span class="filter-chip__text">{{ chipDisplayOf(item) }}</span>
      <button
        type="button"
        class="filter-chip__remove"
        [attr.aria-label]="'Remover ' + displayOf(item)"
        (click)="remove(valueOf(item)); $event.stopPropagation()"
      >
        ×
      </button>
    </div>
  </div>
</div>
